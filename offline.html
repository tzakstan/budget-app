<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline • My Personal Budget Tracker</title>
  <style>
    :root {
      --bg: #f8faff;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --indigo: #4f46e5;
      --emerald: #059669;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      box-sizing: border-box;
      text-align: center;
    }
    .offline-card {
      background: var(--surface);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .icon-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #eef2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px;
      color: var(--text-main);
    }
    p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.55;
      margin: 0 0 24px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    .btn-pri {
      background: var(--indigo);
      color: white;
    }
    .btn-sec {
      background: #f1f5f9;
      color: var(--text-muted);
    }
    .note-badge {
      display: inline-block;
      margin-top: 16px;
      font-size: 11px;
      color: var(--emerald);
      font-weight: 600;
      background: #ecfdf5;
      padding: 4px 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-badge">🌙</div>
    <h1>You are currently offline</h1>
    <p>
      Your Personal Budget Tracker works seamlessly offline. All your data, Bohra calendar dates, and daily habit savings remain securely stored on your device.
    </p>
    <button class="btn btn-pri" onclick="window.location.reload()">↻ Retry Connection</button>
    <button class="btn btn-sec" onclick="window.location.href='./'">Open Saved App</button>
    <div class="note-badge">✓ Offline-Ready Local Storage Active</div>
  </div>
</body>
</html>
